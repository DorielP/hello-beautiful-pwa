<script>

let solvedGrid = [];
let showCorrectness = false;

/* TWINKLING STARS */
const starContainer = document.getElementById("star-container");
const STAR_COUNT = 70;

function createStar() {
  const star = document.createElement("div");
  star.className = "bg-star";

  const size = 3 + Math.random() * 3;
  star.style.width = size + "px";
  star.style.height = size + "px";

  function reposition() {
    star.style.left = Math.random() * window.innerWidth + "px";
    star.style.top = Math.random() * window.innerHeight + "px";
  }

  reposition();
  starContainer.appendChild(star);

  function twinkle() {
    star.style.opacity = 0.2 + Math.random() * 0.6;
    setTimeout(() => {
      star.style.opacity = 0;
      reposition();
      setTimeout(twinkle, 1500 + Math.random() * 2000);
    }, 1500 + Math.random() * 2000);
  }

  setTimeout(twinkle, Math.random() * 2000);
}

for (let i = 0; i < STAR_COUNT; i++) {
  createStar();
}

/* SHOOTING STARS */
function shootingStar() {
  const star = document.createElement("div");
  star.className = "shooting-star";
  star.style.top = Math.random() * window.innerHeight * 0.5 + "px";
  star.style.left = Math.random() * window.innerWidth + "px";
  document.body.appendChild(star);
  setTimeout(() => star.remove(), 1000);
}

setInterval(shootingStar, 6000);

if ("serviceWorker" in navigator) {
  navigator.serviceWorker
    .register("service-worker.js")
    .then(() => console.log("Service Worker registered!"));
}
  
/* COMPLIMENTS */
const compliments = [
  "You are genuinely lovely, inside and out",
  "The world feels better because you exist",
  "You deserve kindness, especially from yourself",
  "You bring warmth without even trying",
  "I hope today treats you gently",
  "You are more appreciated than you realise",
  "Your smile brightens my day, and I love hearing you laugh",
  "You are worth so much, and deserve the best",
  "You are such an amazing, genuine, and wonderful person",
  "I cannot imagine my life without you in it, you make such a difference just being here",
  "I admire the passion you bring to things in life, and that you care about all the little details",
  "I really feel like I can just be myself around you, you provide such a safe space",
  "You inspire me to be better, and do better for myself, and that means a lot",
  "You are unbelievably resilient, and I am so proud of you",
  "You remind me of the sun, bright, warm, and something I hope is always in my life",
  "You are my favourite distraction",
  "You have the kind of beauty that radiates from within. Don't get me wrong though, the outside is just as lovely",
  "I love the way you make me feel heard and seen",
  "I am completely fascinated by the way your mind works, and everything you tell me",
  "You're rare, and I will never take that for granted",
  "You make the ordinary feel extraordinary",
  "I will always be here for you, no matter what",
  "I thoroughly enjoy staying up and just chatting with you about anything and everything",
  "I find myself missing you constantly",
  "I'm so happy that the circumstances aligned for us to meet and get to know each other",
  "Thank you for being you, such a fantastic and thoughtful person, I would never want you any other way",
  "I admire your bravery to speak up on things that matter to you",
  "You are good at being proactive, and your routines inspire me",
  "You are so strong, and I am happy to be a shoulder to lean on whenever you need help bouncing back",
  "Your advice is meaningful to me, and I can count on you to be honest",
  "Your enthusiasm for adventure is contagious and exciting",
  "I am grateful for how you show up for me physically, emotionally, and spiritually",
  "Talking with you and being around you energises me creatively",
  "I appreciate how much you allow me to feel my feelings without judgement",
  "Your experiences have made you the strong and knowledgeable person today, and it is important to recognise the work you've done",
  "Your ability to consider a problem from multiple angles and perspectives is a gift",
  "You embrace your silliness unapologetically, and it's inspiring"
];

function revealMessage() {
  const message = compliments[Math.floor(Math.random() * compliments.length)];
  const surprise = document.getElementById("surprise");

  surprise.textContent = message;
  surprise.style.display = "block";

  launchConfetti();
}

/* CONFETTI */
function launchConfetti() {
  const colors = ["#4f7aa6", "#6fa8dc", "#8fbce6", "#b7d7f0"];
  const button = document.querySelector(".button");
  const rect = button.getBoundingClientRect();

  const startX = rect.left + rect.width / 2;
  const startY = rect.top + rect.height / 2 + window.scrollY;

  for (let i = 0; i < 40; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = startX + "px";
    piece.style.top = startY + "px";
    piece.style.backgroundColor =
      colors[Math.floor(Math.random() * colors.length)];
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;

    document.body.appendChild(piece);

    // Random velocity and direction
    const angle = Math.random() * 2 * Math.PI; // random direction
    const speed = 100 + Math.random() * 200; // how far it explodes
    const velocityX = Math.cos(angle) * speed;
    const velocityY = Math.sin(angle) * speed + 100; // add a bit downward force

    piece.animate(
      [
        { transform: `translate(0,0) rotate(0deg)`, opacity: 1 },
        {
          transform: `translate(${velocityX}px, ${velocityY}px) rotate(${360 +
            Math.random() * 360}deg)`,
          opacity: 0
        }
      ],
      {
        duration: 2000 + Math.random() * 1000,
        easing: "ease-out",
        fill: "forwards"
      }
    );

    setTimeout(() => piece.remove(), 3000);
  }
}
const music = document.getElementById("bg-music");
let isPlaying = false;

function toggleMusic(btn) {
  if (!isPlaying) {
    music.play();
    isPlaying = true;
    btn.textContent = "Pause music";
  } else {
    music.pause();
    isPlaying = false;
    btn.textContent = "A song that makes me think of you";
  }
}

function newSudoku(level) {
  history = [];

  solvedGrid = generateSolvedGrid();              // KEEP IT
  const puzzle = removeNumbers(solvedGrid, level);

  renderGrid(puzzle);
  saveState();
}

function toggleCheck(btn) {
  showCorrectness = !showCorrectness;
  btn.textContent = showCorrectness ? "✔ Checking" : "✔ Check";

  checkCorrectness();
}

function checkCorrectness() {
  const cells = document.querySelectorAll(".sudoku-cell");

  cells.forEach((cell, i) => {
    const input = cell.querySelector("input");

    cell.classList.remove("correct", "incorrect");

    if (!showCorrectness || !input.value || input.disabled) return;

    const row = Math.floor(i / 9);
    const col = i % 9;

    if (Number(input.value) === solvedGrid[row][col]) {
      cell.classList.add("correct");
    } else {
      cell.classList.add("incorrect");
    }
  });
}

function showToast(message, duration = 3000) {
  const container = document.getElementById("toast-container");
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.textContent = message;
  container.appendChild(toast);

  setTimeout(() => {
    toast.remove();
  }, duration);
}



/* ------------------ SOLVER ------------------ */

function generateSolvedGrid() {
  const grid = Array.from({ length: 9 }, () => Array(9).fill(""));

  fillGrid(grid);
  return grid;
}

function fillGrid(grid) {
  for (let row = 0; row < 9; row++) {
    for (let col = 0; col < 9; col++) {
      if (grid[row][col] === "") {
        shuffle([1,2,3,4,5,6,7,8,9]).forEach(num => {
          if (isValid(grid, row, col, num)) {
            grid[row][col] = num;
            if (fillGrid(grid)) return true;
            grid[row][col] = "";
          }
        });
        return false;
      }
    }
  }
  return true;
}

function isValid(grid, row, col, num) {
  for (let i = 0; i < 9; i++) {
    if (
      grid[row][i] === num ||
      grid[i][col] === num ||
      grid[Math.floor(row/3)*3 + Math.floor(i/3)]
          [Math.floor(col/3)*3 + i%3] === num
    ) return false;
  }
  return true;
}

function shuffle(arr) {
  return arr.sort(() => Math.random() - 0.5);
}

/* ------------------ PUZZLE CREATION ------------------ */

function removeNumbers(grid, level) {
  const puzzle = grid.map(row => row.slice());

  const removals = {
    easy: 30,
    medium: 40,
    hard: 48
  }[level] || 40;

  const rowRemovals = Array(9).fill(0);
  const maxPerRow = Math.ceil(removals / 9) + 1;

  const boxRemovals = Array(9).fill(0);
  const maxPerBox = Math.ceil(removals / 9) + 1;

  let removed = 0;
  let attempts = 0;

  while (removed < removals && attempts < 2000) {
    attempts++;

    const row = Math.floor(Math.random() * 9);
    const col = Math.floor(Math.random() * 9);
    const boxIndex = Math.floor(row / 3) * 3 + Math.floor(col / 3);

    if (puzzle[row][col] === "") continue;
    if (rowRemovals[row] >= maxPerRow) continue;
    if (boxRemovals[boxIndex] >= maxPerBox) continue;

    puzzle[row][col] = "";
    rowRemovals[row]++;
    boxRemovals[boxIndex]++;
    removed++;
  }

  return puzzle;
}

let notesMode = false;

let history = [];

function saveState() {
  const state = [];
  document.querySelectorAll(".sudoku-cell").forEach(cell => {
    const input = cell.querySelector("input");
    const notes = [...cell.querySelectorAll(".note")].map(n => n.textContent);
    state.push({ value: input.value, notes });
  });
  history.push(state);
}

function undoMove() {
  if (!history.length) return;

  const state = history.pop();
  document.querySelectorAll(".sudoku-cell").forEach((cell, i) => {
    const input = cell.querySelector("input");
    const notes = cell.querySelectorAll(".note");

    input.value = state[i].value;
    notes.forEach((n, idx) => (n.textContent = state[i].notes[idx]));
  });
}

function checkConflicts() {
  const cells = [...document.querySelectorAll(".sudoku-cell")];
  cells.forEach(c => c.classList.remove("conflict"));

  cells.forEach((cell, i) => {
    const input = cell.querySelector("input");
    if (!input.value) return;

    const row = Math.floor(i / 9);
    const col = i % 9;

    cells.forEach((other, j) => {
      if (i === j) return;
      const oInput = other.querySelector("input");
      if (!oInput.value) return;

      const r = Math.floor(j / 9);
      const c = j % 9;

      const sameBlock =
        Math.floor(row / 3) === Math.floor(r / 3) &&
        Math.floor(col / 3) === Math.floor(c / 3);

      if (
        oInput.value === input.value &&
        (row === r || col === c || sameBlock)
      ) {
        cell.classList.add("conflict");
        other.classList.add("conflict");
      }
    });
  });
}
function checkWin() {
  const cells = [...document.querySelectorAll(".sudoku-cell")];

  // All cells filled?
  if (cells.some(c => !c.querySelector("input").value)) return;

  // No conflicts?
  checkConflicts();
  if (cells.some(c => c.classList.contains("conflict"))) return;

function setOrb(scale, glow, duration) {

  orb.style.transform = `scale(${scale})`;

  `;
}

function startBreathingCycle() {
  clearBreathTimers();

  // INHALE – grow noticeably
  breathText.textContent = "Inhale";
  setOrb(1.15, 60, 4000);

  breathTimeouts.push(setTimeout(() => {

/* =========================
   COIN SORT GAME
========================= */

const COIN_COLS = 10;
const COLUMN_HEIGHT = 12;
const MAX_LEVEL = 99;

let selectedCol = null;
let gameOver = false;
let nextBundleId = 1;


const coinTypes = [
  { color: "#35b9c8", label: "1" },
  { color: "#e96c63", label: "2" },
  { color: "#f1b938", label: "3" },
  { color: "#65bd78", label: "4" },
  { color: "#438de0", label: "5" },
  { color: "#8669e8", label: "6" },
  { color: "#df58b5", label: "7" },
  { color: "#f28a4a", label: "8" }
];

function getCoinType(level) {
  if (level < coinTypes.length) {
    return coinTypes[level];
  }

  // Cycle through colours for higher-level coins.
  const hue = (level * 47) % 360;

  return {
    color: `hsl(${hue}, 65%, 55%)`,
    label: String(level + 1)
  };
}


/* Each coin stores its number and optional bundle ID.
   Coins sharing a bundle ID are tied together. */
function makeCoin(level, bundleId = null) {
  return { level, bundleId };
}

let board = Array.from(
  { length: COIN_COLS },
  () => []
);

const boardEl = document.getElementById("coin-board");


/* ---------- BOARD CREATION ---------- */

function createBoard() {
  boardEl.innerHTML = "";

  for (let i = 0; i < COIN_COLS; i++) {
    const column = document.createElement("div");
    column.className = "coin-column";
    boardEl.appendChild(column);
  }
}


/* ---------- FIND MOVABLE COINS ---------- */

/* Only the exposed top coins can move.
   If the top coin is tied, return its entire tied group.
   Otherwise, return the consecutive untied coins of
   the same number at the top of the column. */

function getMovableGroup(column) {
  if (!column.length) return [];

  const top = column[column.length - 1];
  let start = column.length - 1;

  if (top.bundleId !== null) {
    // A tied group must remain together.
    while (start > 0) {
      const below = column[start - 1];

      if (
        below.bundleId !== top.bundleId ||
        below.level !== top.level
      ) {
        break;
      }

      start--;
    }
  } else {
    // Collect the exposed, untied coins of the same value.
    while (start > 0) {
      const below = column[start - 1];

      if (
        below.level !== top.level ||
        below.bundleId !== null
      ) {
        break;
      }

      start--;
    }
  }

  return column.slice(start);
}


/* ---------- DRAW THE BOARD ---------- */

function renderBoard() {
  const columns = boardEl.querySelectorAll(".coin-column");

  columns.forEach((columnEl, i) => {
    columnEl.innerHTML = "";
    columnEl.classList.remove(
      "mergeable",
      "selected"
    );
    columnEl.removeAttribute("title");

    const column = board[i];

    // Highlight a full, mergeable column.
    if (
      column.length === COLUMN_HEIGHT &&
      column.every(coin =>
        coin.level === column[0].level
      ) &&
      column[0].level < MAX_LEVEL
    ) {
      columnEl.classList.add("mergeable");
    }

    if (i === selectedCol) {
      columnEl.classList.add("selected");
    }

    // Preview how many coins could move here.
    if (
      selectedCol !== null &&
      selectedCol !== i &&
      board[selectedCol].length
    ) {
      const group = getMovableGroup(board[selectedCol]);

      if (group.length) {
        const level = group[group.length - 1].level;
        const freeSpace = COLUMN_HEIGHT - column.length;
        const bound = group[group.length - 1].bundleId !== null;

        const matches =
          !column.length ||
          column[column.length - 1].level === level;

        if (matches && freeSpace > 0) {
          let possibleCount = 0;

          if (bound) {
            // Never offer a partial move for a tied group.
            if (group.length <= freeSpace) {
              possibleCount = group.length;
            }
          } else {
            possibleCount = Math.min(
              group.length,
              freeSpace
            );
          }

          if (possibleCount > 0) {
            columnEl.title =
              `Move ${possibleCount} coin(s)`;
          }
        }
      }
    }

    column.forEach((coinData, idx) => {
      const coin = document.createElement("div");
      coin.className = "coin";

      const type = getCoinType(coinData.level);

coin.style.setProperty("--coin-color", type.color);

      // Show the number only on the exposed top coin.
      if (idx === column.length - 1) {
        coin.classList.add("coin-top");
        coin.textContent = type.label;
      }

      if (coinData.bundleId !== null) {
        coin.classList.add("bound");
        coin.title = "Tied coins — move together";
      }

      columnEl.appendChild(coin);
    });

    columnEl.onclick = () => handleColumnClick(i);
  });
}


/* ---------- SELECT AND MOVE ---------- */

function handleColumnClick(index) {
  if (gameOver) return;

  if (selectedCol === null) {
    if (board[index].length) {
      selectedCol = index;
      renderBoard();
    }
    return;
  }

  if (selectedCol === index) {
    selectedCol = null;
    renderBoard();
    return;
  }

  moveCoin(selectedCol, index);
  selectedCol = null;
  renderBoard();
}


/* ---------- DEAL ---------- */

function randomDealLevel() {
  return Math.floor(Math.random() * 4);
}




function dealCoin() {
  if (gameOver) return;

  selectedCol = null;

  for (let i = 0; i < COIN_COLS; i++) {
    const column = board[i];
    const startingLength = column.length;
    const freeSpace = COLUMN_HEIGHT - startingLength;

    // Skip columns that are already full.
    if (freeSpace <= 0) continue;

    let previousLevel = startingLength
      ? column[column.length - 1].level
      : null;

    // Choose a different number from the previous batch.
    function chooseLevel() {
      let level = randomDealLevel();

      if (level === previousLevel) {
        level = (
          level + 1 +
          Math.floor(Math.random() * (coinTypes.length - 1))
        ) % coinTypes.length;
      }

      previousLevel = level;
      return level;
    }

    // Deal one batch of a single number.
    function addBatch(requestedSize) {
      const size = Math.min(
        requestedSize,
        COLUMN_HEIGHT - column.length
      );

      if (size <= 0) return;

      const level = chooseLevel();

      // Occasionally bind 2–3 coins together.
      let bundleId = null;
      let bundleSize = 0;
      let bundleStart = -1;

      if (size >= 2 && Math.random() < 0.20) {
        bundleSize = Math.min(
          size,
          2 + Math.floor(Math.random() * 2)
        );

        bundleStart = Math.floor(
          Math.random() * (size - bundleSize + 1)
        );

        bundleId = nextBundleId++;
      }

      for (let b = 0; b < size; b++) {
        const isBundled =
          bundleId !== null &&
          b >= bundleStart &&
          b < bundleStart + bundleSize;

        column.push(
          makeCoin(
            level,
            isBundled ? bundleId : null
          )
        );
      }
    }

    // Deal size depends on how much room remains.
    let batchSize;

    if (freeSpace >= 9) {
      // Plenty of room: a normal batch of 3–4.
      batchSize = 3 + Math.floor(Math.random() * 2);
    } else if (freeSpace >= 6) {
      // Partly filled: a smaller batch of 2–3.
      batchSize = 2 + Math.floor(Math.random() * 2);
    } else if (freeSpace >= 3) {
      // Getting full: just 2 coins.
      batchSize = 2;
    } else {
      // Almost full: use only the remaining space.
      batchSize = freeSpace;
    }

    addBatch(batchSize);

    // Only occasionally deal a second batch, and only
    // when the column started nearly empty and there's
    // still plenty of space.
    const remainingSpace = COLUMN_HEIGHT - column.length;

    if (
      startingLength <= 2 &&
      remainingSpace >= 4 &&
      Math.random() < 0.18
    ) {
      const secondBatchSize =
        2 + Math.floor(Math.random() * 2);

      addBatch(secondBatchSize);
    }
  }

  checkLoss();
  renderBoard();
}




/* ---------- MOVE THE COINS ---------- */

function moveCoin(from, to) {
  if (from === to || !board[from].length) return;

  const fromCol = board[from];
  const toCol = board[to];

  const group = getMovableGroup(fromCol);

  if (!group.length) return;

  const topCoin = fromCol[fromCol.length - 1];
  const value = topCoin.level;

  // A destination must be empty or have the same number
  // exposed on its top coin.
  if (
    toCol.length &&
    toCol[toCol.length - 1].level !== value
  ) {
    showToast("Coins must match 🔁");
    return;
  }

  const freeSpace = COLUMN_HEIGHT - toCol.length;

  if (freeSpace <= 0) {
    showToast("That column is full 🧱");
    return;
  }

  const isBound = topCoin.bundleId !== null;

  let moveCount;

  if (isBound) {
    // A bound group is all-or-nothing.
    if (group.length > freeSpace) {
      showToast(
        "Those coins are tied together and won't fit 🪢"
      );
      return;
    }

    moveCount = group.length;
  } else {
    // Untied coins can move partially if necessary.
    moveCount = Math.min(group.length, freeSpace);
  }

  // Remove coins from the top and preserve their order.
  const movedCoins = fromCol.splice(
    fromCol.length - moveCount,
    moveCount
  );

  // Place them neatly on top of the destination stack.
  toCol.push(...movedCoins);

  checkLoss();
}


/* ---------- MERGE COLUMNS ---------- */

function mergeColumns() {
  if (gameOver) return;

  let mergedCount = 0;

  for (let i = 0; i < COIN_COLS; i++) {
    const column = board[i];

    // A column must be full and contain matching coins.
    if (column.length !== COLUMN_HEIGHT) continue;

    const level = column[0].level;

    if (level >= MAX_LEVEL) continue;

    const allMatch = column.every(
      coin => coin.level === level
    );

    if (!allMatch) continue;

    // Replace the entire stack with one coin of the next level.
    board[i] = [
      makeCoin(level + 1)
    ];

    mergedCount++;
  }

  selectedCol = null;

  if (mergedCount > 0) {
    showToast(
      `✨ Merged ${mergedCount} column${mergedCount === 1 ? "" : "s"}!`
    );
  } else {
    showToast("Fill a column with 12 matching coins to merge 🪙");
  }

  checkLoss();
  renderBoard();
}

/* ---------- LOSS ---------- */

function checkLoss() {
  const full = board.every(
    column => column.length >= COLUMN_HEIGHT
  );

  if (!full || gameOver) return;

  gameOver = true;
  showToast("💥 Game Over! Board is full 💥");
}


/* ---------- RESTART ---------- */

function restartCoinGame() {
  board = Array.from(
    { length: COIN_COLS },
    () => []
  );

  selectedCol = null;
  gameOver = false;
  nextBundleId = 1;

  renderBoard();
}


/* ---------- START ---------- */

createBoard();
renderBoard();




</script>
